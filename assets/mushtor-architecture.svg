<svg viewBox="0 0 1300 980" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- ============ DEFS ============ -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c07b1f"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b3651a"/>
    </marker>
  </defs>

  <!-- ============ BACKGROUND ============ -->
  <rect x="0" y="0" width="1300" height="980" fill="#f7f8fa"/>

  <!-- ============ TITLE ============ -->
  <text x="650" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#1c2430">Mushtor — High-Level System Architecture</text>
  <text x="650" y="68" text-anchor="middle" font-size="13" fill="#8891a0">Bengali SSC/HSC Exam Preparation Platform · abstracted service &amp; data-flow view</text>

  <!-- ============ HOSTING ENVELOPE ============ -->
  <rect x="215" y="170" width="1045" height="560" rx="16" fill="none" stroke="#c7cdd6" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="235" y="195" font-size="12.5" fill="#8891a0" font-weight="600">SHARED HOSTING ENVIRONMENT — cPanel / LiteSpeed / Phusion Passenger (single Python venv)</text>

  <!-- ============ CLIENT LAYER ============ -->
  <rect x="480" y="95" width="150" height="52" rx="10" fill="#eef1f5" stroke="#aeb6c2" stroke-width="1.3"/>
  <text x="555" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2430">Students &amp; Teachers</text>
  <text x="555" y="134" text-anchor="middle" font-size="11" fill="#6b7484">Web Browser</text>

  <!-- Client -> Frontend -->
  <line x1="555" y1="147" x2="555" y2="212" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ SEARCH ENGINE (side) ============ -->
  <rect x="30" y="95" width="150" height="52" rx="10" fill="#eef1f5" stroke="#aeb6c2" stroke-width="1.3"/>
  <text x="105" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#1c2430">Search Engines</text>
  <text x="105" y="134" text-anchor="middle" font-size="11" fill="#6b7484">Googlebot crawl</text>

  <!-- ============ FRONTEND LAYER (Next.js) ============ -->
  <rect x="245" y="212" width="620" height="140" rx="14" fill="#e4edfb" stroke="#5b8fd6" stroke-width="1.6"/>
  <text x="270" y="238" font-size="14.5" font-weight="700" fill="#1c3d6e">Frontend — Next.js 15 (App Router)</text>

  <rect x="270" y="252" width="270" height="80" rx="10" fill="#ffffff" stroke="#a9c3e8" stroke-width="1.2"/>
  <text x="405" y="274" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c3d6e">Public Pages</text>
  <text x="405" y="291" text-anchor="middle" font-size="11" fill="#4d5c73">Server-rendered · ISR</text>
  <text x="405" y="306" text-anchor="middle" font-size="11" fill="#4d5c73">Notes · SEO metadata</text>
  <text x="405" y="321" text-anchor="middle" font-size="11" fill="#4d5c73">Crawler-optimized</text>

  <rect x="565" y="252" width="270" height="80" rx="10" fill="#ffffff" stroke="#a9c3e8" stroke-width="1.2"/>
  <text x="700" y="274" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c3d6e">Authenticated App</text>
  <text x="700" y="291" text-anchor="middle" font-size="11" fill="#4d5c73">Client islands</text>
  <text x="700" y="306" text-anchor="middle" font-size="11" fill="#4d5c73">Quiz sessions · SRS review</text>
  <text x="700" y="321" text-anchor="middle" font-size="11" fill="#4d5c73">Noindexed tool pages</text>

  <!-- Frontend -> API -->
  <line x1="555" y1="352" x2="555" y2="412" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="565" y="386" font-size="10.5" fill="#6b7484">REST calls (JWT)</text>

  <!-- ============ API LAYER (Django) ============ -->
  <rect x="245" y="412" width="620" height="150" rx="14" fill="#e2f3ec" stroke="#4fa87f" stroke-width="1.6"/>
  <text x="270" y="438" font-size="14.5" font-weight="700" fill="#175c3f">Application Layer — Django REST Framework</text>

  <rect x="270" y="452" width="140" height="90" rx="9" fill="#ffffff" stroke="#a4d7bf" stroke-width="1.2"/>
  <text x="340" y="477" text-anchor="middle" font-size="12" font-weight="600" fill="#175c3f">Auth</text>
  <text x="340" y="494" text-anchor="middle" font-size="10.5" fill="#3d5a4d">Session &amp;</text>
  <text x="340" y="508" text-anchor="middle" font-size="10.5" fill="#3d5a4d">token handling</text>

  <rect x="420" y="452" width="140" height="90" rx="9" fill="#ffffff" stroke="#a4d7bf" stroke-width="1.2"/>
  <text x="490" y="477" text-anchor="middle" font-size="12" font-weight="600" fill="#175c3f">Notes Service</text>
  <text x="490" y="494" text-anchor="middle" font-size="10.5" fill="#3d5a4d">Study content</text>
  <text x="490" y="508" text-anchor="middle" font-size="10.5" fill="#3d5a4d">Category tree</text>

  <rect x="570" y="452" width="150" height="90" rx="9" fill="#ffffff" stroke="#a4d7bf" stroke-width="1.2"/>
  <text x="645" y="477" text-anchor="middle" font-size="12" font-weight="600" fill="#175c3f">Question Bank &amp;</text>
  <text x="645" y="491" text-anchor="middle" font-size="12" font-weight="600" fill="#175c3f">Quiz Engine</text>
  <text x="645" y="508" text-anchor="middle" font-size="10.5" fill="#3d5a4d">MCQ delivery</text>

  <rect x="730" y="452" width="125" height="90" rx="9" fill="#ffffff" stroke="#a4d7bf" stroke-width="1.2"/>
  <text x="792" y="477" text-anchor="middle" font-size="12" font-weight="600" fill="#175c3f">SRS</text>
  <text x="792" y="494" text-anchor="middle" font-size="10.5" fill="#3d5a4d">Spaced</text>
  <text x="792" y="508" text-anchor="middle" font-size="10.5" fill="#3d5a4d">repetition</text>

  <!-- API -> DB -->
  <line x1="555" y1="562" x2="555" y2="612" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ DATA LAYER ============ -->
  <rect x="380" y="612" width="350" height="70" rx="12" fill="#ede7f7" stroke="#9b7fc9" stroke-width="1.6"/>
  <text x="555" y="640" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4a2e78">MariaDB</text>
  <text x="555" y="658" text-anchor="middle" font-size="11" fill="#5c4a78">Relational data store (structure abstracted)</text>

  <!-- ============ ISR REVALIDATION LOOP ============ -->
  <path d="M 870 462 C 945 462, 945 280, 870 280" fill="none" stroke="#c07b1f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowDash)"/>
  <rect x="900" y="356" width="92" height="30" rx="5" fill="#f7f8fa"/>
  <text x="946" y="368" text-anchor="middle" font-size="10.5" fill="#a5691b">on-demand</text>
  <text x="946" y="381" text-anchor="middle" font-size="10.5" fill="#a5691b">ISR revalidate</text>

  <!-- ============ SEO BOT-SERVING PATH ============ -->
  <path d="M 105 147 C 105 260, 245 300, 245 300" fill="none" stroke="#5b6472" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="60" y="230" font-size="10.5" fill="#6b7484">crawl request</text>

  <!-- ============ AI CONTENT PIPELINE (in-process, same venv as Django) ============ -->
  <rect x="1000" y="440" width="260" height="270" rx="14" fill="#fbeedd" stroke="#d99a4e" stroke-width="1.6"/>
  <text x="1130" y="465" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8a4f12">AI Content Pipeline</text>
  <text x="1130" y="482" text-anchor="middle" font-size="10.5" fill="#8a4f12">in-process · operator-triggered</text>

  <rect x="1020" y="495" width="220" height="42" rx="8" fill="#ffffff" stroke="#e3b781" stroke-width="1.1"/>
  <text x="1130" y="521" text-anchor="middle" font-size="11.5" fill="#6b4a1f">Source Materials (scanned PDFs)</text>

  <line x1="1130" y1="537" x2="1130" y2="558" stroke="#b3651a" stroke-width="1.4" marker-end="url(#arrowAmber)"/>

  <rect x="1020" y="558" width="220" height="42" rx="8" fill="#ffffff" stroke="#e3b781" stroke-width="1.1"/>
  <text x="1130" y="584" text-anchor="middle" font-size="11.5" fill="#6b4a1f">Gemini OCR Extraction</text>

  <line x1="1130" y1="600" x2="1130" y2="621" stroke="#b3651a" stroke-width="1.4" marker-end="url(#arrowAmber)"/>

  <rect x="1020" y="621" width="220" height="42" rx="8" fill="#ffffff" stroke="#e3b781" stroke-width="1.1"/>
  <text x="1130" y="647" text-anchor="middle" font-size="11.5" fill="#6b4a1f">Human Review Queue</text>

  <line x1="1130" y1="663" x2="1130" y2="684" stroke="#b3651a" stroke-width="1.4" marker-end="url(#arrowAmber)"/>

  <rect x="1020" y="684" width="220" height="42" rx="8" fill="#ffffff" stroke="#e3b781" stroke-width="1.1"/>
  <text x="1130" y="710" text-anchor="middle" font-size="11.5" fill="#6b4a1f">Published to Question Bank</text>

  <!-- pipeline writes into API layer via the ORM (same process, not an external system) -->
  <path d="M 1000 500 C 900 500, 900 500, 855 495" fill="none" stroke="#b3651a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowAmber)"/>
  <rect x="855" y="474" width="82" height="18" rx="4" fill="#f7f8fa"/>
  <text x="895" y="487" font-size="10.5" fill="#8a4f12" text-anchor="middle">Django ORM</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(245,850)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#e4edfb" stroke="#5b8fd6"/>
    <text x="20" y="11.5" font-size="11" fill="#3a3f47">Frontend (Next.js)</text>

    <rect x="180" y="0" width="14" height="14" rx="3" fill="#e2f3ec" stroke="#4fa87f"/>
    <text x="200" y="11.5" font-size="11" fill="#3a3f47">API (Django REST)</text>

    <rect x="360" y="0" width="14" height="14" rx="3" fill="#ede7f7" stroke="#9b7fc9"/>
    <text x="380" y="11.5" font-size="11" fill="#3a3f47">Data (MariaDB)</text>

    <rect x="520" y="0" width="14" height="14" rx="3" fill="#fbeedd" stroke="#d99a4e"/>
    <text x="540" y="11.5" font-size="11" fill="#3a3f47">AI Content Pipeline</text>

    <line x1="700" y1="7" x2="725" y2="7" stroke="#c07b1f" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="730" y="11.5" font-size="11" fill="#3a3f47">Operator-triggered / in-process flow</text>
  </g>

  <text x="650" y="945" text-anchor="middle" font-size="11" fill="#9aa2ad">Diagram intentionally omits table schemas, field-level detail, and internal endpoints.</text>
</svg>
